name: Nexus Application Ecosystem Tests

on:
  push:
    branches:
      - nexus-application-ecosystem
    paths:
      - "kernel/Makefile"
      - "kernel/src/process.h"
      - "kernel/src/process.c"
      - "kernel/src/app_manager.c"
      - "kernel/src/app_manager.h"
      - "kernel/src/download_https.c"
      - "kernel/src/download_https.h"
      - "kernel/tests/app_manager_test.c"
      - "kernel/tests/download_https_test.c"
      - "docs/architecture/APP-ECOSYSTEM-IMPLEMENTATION-PLAN.md"
      - "kernel/src/app_repository.c"
      - "kernel/src/app_repository.h"
      - "kernel/src/download_manager.c"
      - "kernel/src/download_manager.h"
      - "kernel/tests/app_repository_test.c"
      - "kernel/tests/download_manager_test.c"
      - ".github/workflows/nexus-app-ecosystem.yml"
  pull_request:
    branches:
      - nexus-pc-gaming-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-ecosystem:
    name: Signed repository, dependency and large-download tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Nexus
        uses: actions/checkout@v4

      - name: Compile signed repository and dependency tests
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/app_repository.c kernel/src/sha256.c \
            kernel/tests/app_repository_test.c \
            -o /tmp/nexus-app-repository-test

      - name: Run metadata, signature, search and dependency tests
        run: /tmp/nexus-app-repository-test

      - name: Compile streaming download manager tests
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/download_manager.c kernel/src/sha256.c \
            kernel/tests/download_manager_test.c \
            -o /tmp/nexus-download-manager-test

      - name: Run large transfer, pause, resume, retry and integrity tests
        run: /tmp/nexus-download-manager-test

      - name: Compile verified HTTPS download source tests
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/download_https.c kernel/src/http.c \
            kernel/tests/download_https_test.c \
            -o /tmp/nexus-download-https-test

      - name: Run URL parsing, TLS verification and HTTP framing tests
        run: /tmp/nexus-download-https-test

      - name: Compile native app install transaction tests
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src -Ikernel/include kernel/src/app_manager.c kernel/src/app_repository.c \
            kernel/src/sha256.c kernel/tests/app_manager_test.c \
            -o /tmp/nexus-app-manager-test

      - name: Run dependency install, update, launch, remove, retry and rollback tests
        run: /tmp/nexus-app-manager-test
