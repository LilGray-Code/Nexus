name: Build Nexus OS ISO

on:
  push:
    branches: [main]
    paths:
      - "NexusOS-Standalone-GitHub-Build-v5.tar.xz"
      - ".github/workflows/nexus-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    name: Build Debian 13 BIOS/UEFI installer
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s NexusOS-Standalone-GitHub-Build-v5.tar.xz
          echo "0354c907bb78df89607983731b07b9c83890b942a208a1a60e95fd4388941150  NexusOS-Standalone-GitHub-Build-v5.tar.xz" | sha256sum -c -

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf NexusOS-Standalone-GitHub-Build-v5.tar.xz
          chmod +x build/*.sh
          test -f build/build-iso.sh
          test -f NexusDesktop/ai.html
          {
            echo "Nexus OS source inventory"
            echo "Git commit: $GITHUB_SHA"
            echo
            echo "Top-level entries:"
            find . -mindepth 1 -maxdepth 1 -printf '%y %p\n' | sort
            echo
            echo "Files (depth <= 4):"
            find . -maxdepth 4 -type f -not -path './.git/*' -printf '%p\t%s bytes\n' | sort
            echo
            echo "Desktop package metadata:"
            cat NexusDesktop/package.json
          } > /tmp/nexus-source-inventory.txt

      - name: Set desktop package metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("NexusDesktop/package.json")
          data = json.loads(path.read_text())
          data.setdefault("homepage", "https://github.com/LilGray-Code/Nexus")
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Build inside Debian 13
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -lc './build/prepare-build-host.sh && ./build/build-iso.sh'

      - name: Verify ISO and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s release/NexusOS-Standalone-amd64.iso
          cd release
          sha256sum -c SHA256SUMS.txt
          file NexusOS-Standalone-amd64.iso

      - name: Write release build manifest
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(sha256sum NexusOS-Standalone-GitHub-Build-v5.tar.xz | awk '{print $1}')"
          iso_sha="$(sha256sum release/NexusOS-Standalone-amd64.iso | awk '{print $1}')"
          {
            echo "Product: Nexus OS"
            echo "Build type: Debian 13 standalone amd64 installer"
            echo "Git commit: $GITHUB_SHA"
            echo "Source archive SHA-256: $source_sha"
            echo "ISO SHA-256: $iso_sha"
            echo "Built at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > release/BUILD-INFO.txt
          cd release
          sha256sum NexusOS-Standalone-amd64.iso BUILD-INFO.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Install firmware boot-test tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf xorriso

      - name: Inspect El Torito boot catalog
        shell: bash
        run: |
          set -euo pipefail
          xorriso -indev release/NexusOS-Standalone-amd64.iso -report_el_torito plain | tee /tmp/nexus-el-torito.txt
          grep -qi "El Torito" /tmp/nexus-el-torito.txt

      - name: Firmware execution smoke test (legacy BIOS)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=5s 20s qemu-system-x86_64 -machine pc,accel=tcg -m 2048 -cdrom release/NexusOS-Standalone-amd64.iso -boot order=d -display none -serial file:/tmp/nexus-bios-serial.log -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "BIOS QEMU smoke test exited unexpectedly: $status"
            cat /tmp/nexus-bios-serial.log || true
            exit 1
          fi

      - name: Firmware execution smoke test (UEFI)
        shell: bash
        run: |
          set -euo pipefail
          firmware="$(find /usr/share -type f -iname 'OVMF_CODE*.fd' | head -n 1)"
          test -n "$firmware"
          set +e
          timeout --signal=TERM --kill-after=5s 20s qemu-system-x86_64 -machine q35,accel=tcg -m 2048 -bios "$firmware" -cdrom release/NexusOS-Standalone-amd64.iso -boot order=d -display none -serial file:/tmp/nexus-uefi-serial.log -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "UEFI QEMU smoke test exited unexpectedly: $status"
            cat /tmp/nexus-uefi-serial.log || true
            exit 1
          fi

      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexusOS-Boot-Diagnostics
          path: |
            /tmp/nexus-source-inventory.txt
            /tmp/nexus-el-torito.txt
            /tmp/nexus-bios-serial.log
            /tmp/nexus-uefi-serial.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installable ISO
        uses: actions/upload-artifact@v4
        with:
          name: NexusOS-Standalone-amd64-ISO
          path: |
            release/NexusOS-Standalone-amd64.iso
            release/SHA256SUMS.txt
            release/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
