name: Nexus Calculator arithmetic tests

on:
  push:
    branches:
      - nexus-original-kernel-roadmap
    paths:
      - "kernel/src/calculator.c"
      - "kernel/src/calculator.h"
      - "kernel/tests/calculator_test.c"
      - ".github/workflows/nexus-calculator-tests.yml"
  pull_request:
    branches:
      - nexus-original-kernel-roadmap
    paths:
      - "kernel/src/calculator.c"
      - "kernel/src/calculator.h"
      - "kernel/tests/calculator_test.c"
      - ".github/workflows/nexus-calculator-tests.yml"

permissions:
  contents: read

jobs:
  calculator-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile calculator parser with strict warnings
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/calculator.c \
            kernel/tests/calculator_test.c -o /tmp/nexus-calculator-test
      - name: Run integer arithmetic, precedence and error tests
        run: /tmp/nexus-calculator-test
