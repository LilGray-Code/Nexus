name: Nexus comprehensive Settings integration

on:
  push:
    branches:
      - nexus-comprehensive-settings-service-integration
    paths:
      - "kernel/src/settings.c"
      - "kernel/src/settings.h"
      - "kernel/src/desktop.c"
      - "kernel/src/desktop.h"
      - "kernel/src/audio.c"
      - "kernel/src/audio.h"
      - "kernel/src/wifi.c"
      - "kernel/src/wifi.h"
      - "kernel/src/gaming.c"
      - "kernel/src/gaming.h"
      - "kernel/src/game_library.c"
      - "kernel/src/process.c"
      - "kernel/src/service_manager.c"
      - "kernel/tests/settings_test.c"
      - "docs/architecture/SETTINGS-ARCHITECTURE.md"
      - "kernel/Makefile"
      - ".github/workflows/nexus-comprehensive-settings.yml"
  pull_request:
    branches:
      - nexus-storage-management-native-fs-recovery
    paths:
      - "kernel/src/settings.c"
      - "kernel/src/settings.h"
      - "kernel/src/desktop.c"
      - "kernel/src/desktop.h"
      - "kernel/src/audio.c"
      - "kernel/src/audio.h"
      - "kernel/src/wifi.c"
      - "kernel/src/wifi.h"
      - "kernel/src/gaming.c"
      - "kernel/src/gaming.h"
      - "kernel/src/game_library.c"
      - "kernel/src/process.c"
      - "kernel/src/service_manager.c"
      - "kernel/tests/settings_test.c"
      - "docs/architecture/SETTINGS-ARCHITECTURE.md"
      - "kernel/Makefile"
      - ".github/workflows/nexus-comprehensive-settings.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run Settings validation and search tests
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/settings.c kernel/tests/settings_test.c \
            -o /tmp/nexus-settings-test
          /tmp/nexus-settings-test
      - name: Compile complete freestanding Nexus kernel
        run: make -C kernel
