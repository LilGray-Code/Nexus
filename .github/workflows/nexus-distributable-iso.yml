name: Nexus Distributable Original-Kernel ISO

on:
  push:
    branches:
      - nexus-original-kernel-roadmap
    paths:
      - "kernel/**"
      - "boot/**"
      - "build/**"
      - "installer/**"
      - "toolchain/**"
      - ".github/workflows/nexus-distributable-iso.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-distributable-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build and smoke-test the distributable Nexus ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the original Nexus kernel branch
        uses: actions/checkout@v4

      - name: Install ISO and emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 10s 8m sudo apt-get install -y --no-install-recommends \
            build-essential binutils curl git xorriso qemu-system-x86 ovmf \
            file dosfstools mtools

      - name: Test bundled native and web Store entries
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/app_store.c \
            kernel/tests/app_store_test.c \
            -o /tmp/nexus-app-store-test
          /tmp/nexus-app-store-test
          grep -q "NATIVE APPS + POPULAR PRODUCTIVITY / WEB APPS" kernel/src/desktop.c
          grep -q "Store is not yet connected to this package pipeline" README.md

      - name: Test signed package and catalog parser contracts
        shell: bash
        run: |
          set -euo pipefail
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/src/package.c kernel/src/sha256.c \
            kernel/tests/package_test.c -o /tmp/nexus-package-test
          /tmp/nexus-package-test
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/src/catalog.c kernel/src/sha256.c \
            kernel/tests/catalog_test.c -o /tmp/nexus-catalog-test
          /tmp/nexus-catalog-test

      - name: Build the non-self-test distributable BIOS and UEFI ISO
        id: build_iso
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build/build-iso.sh
          EXTRA_CFLAGS="-DNEXUS_INSTALLER_ENABLE_DESTRUCTIVE_WRITES" \
            timeout -k 10s 90m ./build/build-iso.sh
          test -s release/NexusOS-OriginalKernel-x86_64.iso
          (cd release && sha256sum --check SHA256SUMS.txt)
          file release/NexusOS-OriginalKernel-x86_64.iso

      - name: Independently verify ISO payload, contents, and build report
        shell: bash
        run: |
          set -euo pipefail
          python3 build/release.py verify \
            --iso release/NexusOS-OriginalKernel-x86_64.iso \
            --kernel build/nexus-kernel.elf \
            --system-pack build/system-pack/NEXUS-SYSTEM.NXP
          (cd release && sha256sum --check SHA256SUMS.txt)
          echo "Exact distributable ISO size:"
          stat --printf='%n %s bytes\n' release/NexusOS-OriginalKernel-x86_64.iso
          cat release/BUILD-INFO.txt

      - name: Exercise installer deployment onto a disposable disk image
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src -Ikernel/include -Iinstaller \
            kernel/src/blockdev.c kernel/src/gpt.c \
            kernel/src/installer_storage.c kernel/src/installer_runtime.c \
            kernel/src/boot_payload.c kernel/src/boot_pack.c kernel/src/nxfs.c \
            installer/installer_journal.c installer/partition_plan.c \
            installer/fat32_format.c installer/fat32_file.c installer/bios_install.c \
            installer/gpt_image.c installer/gpt_install.c \
            installer/tests/installer_storage_test.c \
            -o /tmp/nexus-installer-storage-test
          /tmp/nexus-installer-storage-test
          /tmp/nexus-installer-storage-test build/nexus-kernel.elf \
            build/limine-binary/BOOTX64.EFI build/limine-binary/limine-bios-hdd.bin \
            build/limine-binary/limine-bios.sys build/system-pack/NEXUS-SYSTEM.NXP \
            /tmp/nexus-installed-uefi.img

          dd if=/tmp/nexus-installed-uefi.img of=/tmp/nexus-installed-esp.img \
            bs=512 skip=2048 count=1048576 status=none
          fsck.fat -n /tmp/nexus-installed-esp.img
          mdir -i /tmp/nexus-installed-esp.img ::/EFI/BOOT
          mdir -i /tmp/nexus-installed-esp.img ::/boot/limine
          mtype -i /tmp/nexus-installed-esp.img ::/boot/limine/limine.conf \
            > /tmp/nexus-installed-limine.conf
          grep -q '^/Nexus OS - Installed Desktop$' /tmp/nexus-installed-limine.conf
          grep -q 'cmdline: nexus.mode=desktop' /tmp/nexus-installed-limine.conf
          ! grep -q 'nexus.mode=installer' /tmp/nexus-installed-limine.conf

      - name: Verify USB keyboard and mouse in installer and installed desktop
        shell: bash
        run: |
          set -euo pipefail
          python3 build/test-qemu-input.py \
            --mode installer \
            --iso release/NexusOS-OriginalKernel-x86_64.iso \
            --firmware-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --firmware-vars /usr/share/OVMF/OVMF_VARS_4M.fd
          python3 build/test-qemu-input.py \
            --mode desktop \
            --disk /tmp/nexus-installed-uefi.img \
            --firmware-code /usr/share/OVMF/OVMF_CODE_4M.fd \
            --firmware-vars /usr/share/OVMF/OVMF_VARS_4M.fd

      - name: Boot the installed target through UEFI and legacy BIOS
        shell: bash
        run: |
          set -euo pipefail
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/nexus-installed-uefi-vars.fd
          set +e
          timeout -k 2s 18s qemu-system-x86_64 \
            -machine q35 -cpu qemu64 -m 512M \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=/tmp/nexus-installed-uefi-vars.fd \
            -drive file=/tmp/nexus-installed-uefi.img,if=none,id=installed,format=raw \
            -device qemu-xhci,id=xhci \
            -device usb-storage,bus=xhci.0,drive=installed,bootindex=1 \
            -boot order=c -display none -serial file:installed-uefi-serial.log \
            -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          if [[ "$status" -ne 124 && "$status" -ne 137 && "$status" -ne 0 ]]; then
            echo "Installed-disk UEFI QEMU exited unexpectedly: $status"
            exit "$status"
          fi
          cat installed-uefi-serial.log
          grep -q "INSTALLER: verified kernel, UEFI loader, BIOS stage-2, and system-pack payloads available" installed-uefi-serial.log
          grep -q "NEXUS K0 BOOT COMPLETE" installed-uefi-serial.log

          set +e
          timeout -k 2s 18s qemu-system-x86_64 \
            -machine pc -cpu qemu64 -m 512M \
            -drive file=/tmp/nexus-installed-uefi.img,if=ide,index=0,format=raw \
            -boot c -display none -serial file:installed-bios-serial.log \
            -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          if [[ "$status" -ne 124 && "$status" -ne 137 && "$status" -ne 0 ]]; then
            echo "Installed-disk BIOS QEMU exited unexpectedly: $status"
            exit "$status"
          fi
          cat installed-bios-serial.log
          grep -q "INSTALLER: verified kernel, UEFI loader, BIOS stage-2, and system-pack payloads available" installed-bios-serial.log
          grep -q "NEXUS K0 BOOT COMPLETE" installed-bios-serial.log

      - name: Boot-check the distributable ISO with UEFI
        shell: bash
        run: |
          set -euo pipefail
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/nexus-iso-uefi-vars.fd
          set +e
          timeout -k 2s 24s qemu-system-x86_64 \
            -machine q35 -cpu qemu64 -m 512M \
            -netdev user,id=n0 -device e1000,netdev=n0 \
            -device virtio-gpu-pci,disable-legacy=on \
            -audiodev none,id=audio0 -device AC97,audiodev=audio0 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=/tmp/nexus-iso-uefi-vars.fd \
            -cdrom release/NexusOS-OriginalKernel-x86_64.iso \
            -boot d -display none -serial file:distributable-uefi.log \
            -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          if [[ "$status" -ne 124 && "$status" -ne 137 && "$status" -ne 0 ]]; then
            echo "UEFI QEMU exited unexpectedly: $status"
            exit "$status"
          fi
          cat distributable-uefi.log
          grep -q "NEXUS BOOT MODE: DEDICATED INSTALLER" distributable-uefi.log
          grep -q "NEXUS INSTALLER SESSION READY" distributable-uefi.log
          grep -q "NEXUS K0 BOOT COMPLETE" distributable-uefi.log
          if grep -q "VIRTIO GPU: 2D resource attached; CPU raster buffer now drives GPU scanout" distributable-uefi.log; then
            echo "UEFI boot used the VirtIO-GPU 2D scanout path."
          else
            grep -q "DESKTOP: using firmware framebuffer backend" distributable-uefi.log
            echo "UEFI boot succeeded with firmware-framebuffer fallback; VirtIO-GPU acceleration was not initialized."
          fi

      - name: Boot-check the distributable ISO with legacy BIOS
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout -k 2s 24s qemu-system-x86_64 \
            -machine pc -cpu max -m 512M \
            -netdev user,id=n0 -device e1000,netdev=n0 \
            -cdrom release/NexusOS-OriginalKernel-x86_64.iso \
            -boot d -display none -serial file:distributable-bios.log \
            -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          if [[ "$status" -ne 124 && "$status" -ne 137 && "$status" -ne 0 ]]; then
            echo "BIOS QEMU exited unexpectedly: $status"
            exit "$status"
          fi
          cat distributable-bios.log
          grep -q "NEXUS BOOT MODE: DEDICATED INSTALLER" distributable-bios.log
          grep -q "NEXUS INSTALLER SESSION READY" distributable-bios.log
          grep -q "NEXUS K0 BOOT COMPLETE" distributable-bios.log

      - name: Upload the boot-tested distributable Nexus ISO and release evidence
        uses: actions/upload-artifact@v4
        with:
          name: NexusOS-OriginalKernel-x86_64-${{ github.sha }}
          path: |
            release/NexusOS-OriginalKernel-x86_64.iso
            release/SHA256SUMS.txt
            release/BUILD-INFO.txt
            release/RELEASE-MANIFEST.TXT
            build/nexus-kernel.elf
            build/system-pack/NEXUS-SYSTEM.NXP
            distributable-uefi.log
            distributable-bios.log
            installed-uefi-serial.log
            installed-bios-serial.log
          if-no-files-found: error
          retention-days: 90
