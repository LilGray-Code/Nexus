name: Nexus Hardware Inventory Tests

on:
  push:
    branches:
      - nexus-original-kernel-roadmap
    paths:
      - "kernel/src/cpu.*"
      - "kernel/src/gpu.*"
      - "kernel/src/pci.*"
      - "kernel/src/wifi_pci.*"
      - "kernel/src/win_driver_inf.*"
      - "kernel/tests/cpu_test.c"
      - "kernel/tests/gpu_test.c"
      - "kernel/tests/wifi_pci_test.c"
      - ".github/workflows/nexus-hardware-inventory-tests.yml"
  pull_request:
    branches:
      - nexus-original-kernel-roadmap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardware-inventory:
    name: Host-test CPU, GPU and Wi-Fi discovery contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test CPU capability discovery
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Ikernel/src kernel/src/cpu.c kernel/tests/cpu_test.c \
            -o /tmp/nexus-cpu-test
          /tmp/nexus-cpu-test
      - name: Test GPU adapter inventory and fallback reporting
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -Ikernel/src kernel/src/gpu.c kernel/tests/gpu_test.c \
            -o /tmp/nexus-gpu-test
          /tmp/nexus-gpu-test
      - name: Test PCI wireless inventory
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -Ikernel/src kernel/src/wifi_pci.c kernel/src/win_driver_inf.c \\
            kernel/tests/wifi_pci_test.c \\
            -o /tmp/nexus-wifi-pci-test
          /tmp/nexus-wifi-pci-test
      - name: Test graphics damage tracking
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Ikernel/src kernel/src/graphics.c kernel/tests/graphics_test.c \
            -o /tmp/nexus-graphics-test
          /tmp/nexus-graphics-test
