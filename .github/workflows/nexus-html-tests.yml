name: Nexus bounded HTML text renderer tests

on:
  push:
    branches:
      - nexus-html-renderer-foundation
    paths:
      - "kernel/src/html_text.c"
      - "kernel/src/html_text.h"
      - "kernel/tests/html_text_test.c"
      - ".github/workflows/nexus-html-tests.yml"
  pull_request:
    branches:
      - nexus-original-kernel-roadmap
    paths:
      - "kernel/src/html_text.c"
      - "kernel/src/html_text.h"
      - "kernel/tests/html_text_test.c"
      - ".github/workflows/nexus-html-tests.yml"

permissions:
  contents: read

jobs:
  html-text-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile HTML text renderer tests with strict warnings
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/html_text.c kernel/tests/html_text_test.c \
            -o /tmp/nexus-html-text-test
      - name: Run HTML text renderer tests
        run: /tmp/nexus-html-text-test
