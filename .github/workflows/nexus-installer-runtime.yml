name: Nexus Installer Runtime Build

on:
  push:
    branches:
      - nexus-original-kernel-roadmap
  pull_request:
    branches:
      - nexus-original-kernel-roadmap

permissions:
  contents: read

jobs:
  freestanding-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Nexus source
        uses: actions/checkout@v4
      - name: Compile and run guarded installer transaction tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror \
            -Ikernel/src -Ikernel/include -Iinstaller \
            installer/tests/installer_runtime_test.c \
            kernel/src/installer_runtime.c installer/partition_plan.c \
            -o /tmp/nexus-installer-runtime-test
          /tmp/nexus-installer-runtime-test
      - name: Compile and run disposable-disk storage adapter tests
        run: |
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Ikernel/src -Ikernel/include -Iinstaller \
            installer/tests/installer_storage_test.c \
            installer/partition_plan.c installer/gpt_image.c \
            installer/gpt_install.c installer/installer_journal.c \
            installer/fat32_format.c installer/fat32_file.c \
            installer/bios_install.c kernel/src/installer_storage.c \
            kernel/src/installer_runtime.c kernel/src/boot_payload.c \
            kernel/src/boot_pack.c kernel/src/blockdev.c \
            kernel/src/gpt.c kernel/src/nxfs.c kernel/src/serial.c \
            -o /tmp/nexus-installer-storage-test
          /tmp/nexus-installer-storage-test
      - name: Build the default write-locked freestanding kernel
        run: make -C kernel clean all
      - name: Compile the guarded installer-enabled kernel variant
        run: make -C kernel clean all EXTRA_CFLAGS=-DNEXUS_INSTALLER_ENABLE_DESTRUCTIVE_WRITES
