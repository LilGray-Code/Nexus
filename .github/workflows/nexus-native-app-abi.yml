name: Nexus Native App ABI

on:
  push:
    branches:
      - nexus-original-kernel-roadmap
    paths:
      - "kernel/src/graphics.c"
      - "kernel/src/graphics.h"
      - "kernel/src/usermode.c"
      - "kernel/src/usermode.h"
      - "kernel/src/interrupts.c"
      - "kernel/src/elf64.c"
      - "kernel/src/process.c"
      - "kernel/src/syscall.h"
      - "kernel/include/nexus/**"
      - "kernel/tests/graphics_blit_test.c"
      - "kernel/tests/app_abi_layout_test.c"
      - "sdk/**"
      - ".github/workflows/nexus-native-app-abi.yml"
  pull_request:
    paths:
      - "kernel/src/graphics.c"
      - "kernel/src/graphics.h"
      - "kernel/src/usermode.c"
      - "kernel/src/usermode.h"
      - "kernel/src/interrupts.c"
      - "kernel/src/syscall.h"
      - "kernel/include/nexus/**"
      - "kernel/tests/graphics_blit_test.c"
      - "kernel/tests/app_abi_layout_test.c"
      - "sdk/**"
  workflow_dispatch:

jobs:
  native-app-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test framebuffer blit and damage tracking
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/src/graphics.c kernel/tests/graphics_blit_test.c \
            -o /tmp/nexus-graphics-blit-test
          /tmp/nexus-graphics-blit-test
      - name: Compile changed kernel runtime sources
        run: |
          flags="-std=gnu11 -Os -Wall -Wextra -Werror -ffreestanding -fno-builtin -fno-stack-protector -fno-pic -fno-pie -fno-asynchronous-unwind-tables -fno-unwind-tables -fno-common -m64 -march=x86-64 -mno-red-zone -mno-mmx -mno-sse -mno-sse2 -mgeneral-regs-only -mcmodel=kernel -Ikernel/include -Ikernel/src -Iinstaller"
          for src in cpu fpu graphics usermode interrupts process elf64 main; do
            cc $flags -c "kernel/src/$src.c" -o "/tmp/nexus-$src.o"
          done
      - name: Check public ABI structure layouts
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -Ikernel/include \
            kernel/tests/app_abi_layout_test.c -o /tmp/nexus-app-abi-layout
          /tmp/nexus-app-abi-layout
      - name: Link a static native app and verify ELF contract
        run: |
          make -C sdk CROSS_COMPILE=
          readelf -h sdk/build/kinetic_demo.elf | grep -q 'Class:.*ELF64'
          readelf -h sdk/build/kinetic_demo.elf | grep -q 'Type:.*EXEC'
          readelf -h sdk/build/kinetic_demo.elf | grep -q 'Machine:.*X86-64'
          if readelf -lW sdk/build/kinetic_demo.elf | grep -Eq 'INTERP|DYNAMIC|TLS'; then
            echo "SDK app unexpectedly needs a dynamic loader or TLS"
            exit 1
          fi
