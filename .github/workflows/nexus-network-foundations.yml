name: Nexus network foundation tests

on:
  push:
    branches:
      - nexus-original-kernel-roadmap
    paths:
      - "kernel/src/**"
      - "kernel/tests/**"
      - "kernel/Makefile"
      - ".github/workflows/nexus-network-foundations.yml"
  pull_request:
    paths:
      - "kernel/src/**"
      - "kernel/tests/**"
      - "kernel/Makefile"
      - ".github/workflows/nexus-network-foundations.yml"

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Nexus
        uses: actions/checkout@v4
      - name: Test hardware random source
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/src/random.c kernel/tests/random_test.c -o /tmp/nexus-random-test
          /tmp/nexus-random-test
      - name: Test TCP retransmission and stream segmentation
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/tests/net_tcp_test.c -o /tmp/nexus-net-tcp-test
          /tmp/nexus-net-tcp-test
      - name: Test WPA2 handshake nonce generation
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/tests/wpa2_handshake_test.c kernel/src/wpa2_handshake.c \
            kernel/src/wpa2_eapol.c kernel/src/wpa2_psk.c \
            kernel/src/wpa2_ccmp.c kernel/src/aes_ccm.c \
            kernel/src/sha256.c kernel/src/random.c \
            -o /tmp/nexus-wpa2-handshake-test
          /tmp/nexus-wpa2-handshake-test
      - name: Test DNS-independent HTTP framing parser
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/src/http.c kernel/tests/http_test.c -o /tmp/nexus-http-test
          /tmp/nexus-http-test
      - name: Test RTC date and epoch conversion
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/src/rtc.c kernel/tests/rtc_test.c -o /tmp/nexus-rtc-test
          /tmp/nexus-rtc-test
      - name: Test Wi-Fi state manager
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/src/wifi.c kernel/tests/wifi_test.c -o /tmp/nexus-wifi-test
          /tmp/nexus-wifi-test
      - name: Test 802.11 beacon and security parser
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/src/wifi_80211.c kernel/tests/wifi_80211_test.c \
            -o /tmp/nexus-wifi-80211-test
          /tmp/nexus-wifi-80211-test
      - name: Test SHA-256, HMAC and HKDF
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/src/sha256.c kernel/tests/sha256_test.c \
            -o /tmp/nexus-sha256-test
          /tmp/nexus-sha256-test
      - name: Fetch and checksum-verify pinned Mbed TLS source
        run: sh toolchain/fetch-mbedtls.sh
      - name: Compile pinned Mbed TLS libraries
        run: |
          cmake -S build/deps/mbedtls-4.1.2 -B build/deps/mbedtls-build \
            -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DMBEDTLS_CONFIG_SET="MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG;MBEDTLS_PLATFORM_TIME_ALT;MBEDTLS_PLATFORM_TIME_TYPE_MACRO=int64_t;MBEDTLS_PLATFORM_GMTIME_R_ALT;MBEDTLS_PLATFORM_MS_TIME_ALT;MBEDTLS_PLATFORM_MEMORY" \
            -DMBEDTLS_CONFIG_UNSET="MBEDTLS_PSA_BUILTIN_GET_ENTROPY;MBEDTLS_NET_C;MBEDTLS_TIMING_C"
          cmake --build build/deps/mbedtls-build --parallel 2
      - name: Test Nexus RNG adapter against Mbed TLS PSA API
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Ikernel/src \
            -Ibuild/deps/mbedtls-4.1.2/include \
            -Ibuild/deps/mbedtls-4.1.2/tf-psa-crypto/include \
            -Ibuild/deps/mbedtls-build/generated/include \
            kernel/src/random.c kernel/src/mbedtls_random.c \
            kernel/tests/mbedtls_random_test.c \
            -o /tmp/nexus-mbedtls-rng-test
          /tmp/nexus-mbedtls-rng-test
      - name: Test Nexus UTC clock adapter against Mbed TLS platform API
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Ikernel/src \
            -Ibuild/deps/mbedtls-4.1.2/include \
            -Ibuild/deps/mbedtls-4.1.2/tf-psa-crypto/include \
            -Ibuild/deps/mbedtls-build/generated/include \
            kernel/src/mbedtls_time.c kernel/tests/mbedtls_time_test.c \
            -o /tmp/nexus-mbedtls-time-test
          /tmp/nexus-mbedtls-time-test
      - name: Test bounded crypto heap allocator
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -DNEXUS_TLS_HEAP_HOST_TEST -Ikernel/src \
            kernel/src/tls_heap.c kernel/tests/tls_heap_test.c \
            -o /tmp/nexus-tls-heap-test
          /tmp/nexus-tls-heap-test
      - name: Test Mbed TLS heap integration
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -DNEXUS_TLS_HEAP_HOST_TEST -Ikernel/src \
            -Ibuild/deps/mbedtls-4.1.2/include \
            -Ibuild/deps/mbedtls-4.1.2/tf-psa-crypto/include \
            -Ibuild/deps/mbedtls-build/generated/include \
            kernel/src/tls_heap.c kernel/src/mbedtls_heap.c \
            kernel/tests/mbedtls_heap_test.c \
            -o /tmp/nexus-mbedtls-heap-test
          /tmp/nexus-mbedtls-heap-test
      - name: Build freestanding kernel
        run: make -C kernel
