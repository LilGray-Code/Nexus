name: Nexus network foundation tests

on:
  push:
    branches:
      - nexus-original-kernel-roadmap
    paths:
      - "kernel/src/**"
      - "kernel/tests/**"
      - "kernel/Makefile"
      - ".github/workflows/nexus-network-foundations.yml"
  pull_request:
    paths:
      - "kernel/src/**"
      - "kernel/tests/**"
      - "kernel/Makefile"
      - ".github/workflows/nexus-network-foundations.yml"

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Nexus
        uses: actions/checkout@v4
      - name: Test hardware random source
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/src/random.c kernel/tests/random_test.c -o /tmp/nexus-random-test
          /tmp/nexus-random-test
      - name: Test TCP retransmission and stream segmentation
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/tests/net_tcp_test.c -o /tmp/nexus-net-tcp-test
          /tmp/nexus-net-tcp-test
      - name: Test WPA2 handshake nonce generation
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/tests/wpa2_handshake_test.c kernel/src/wpa2_handshake.c \
            kernel/src/wpa2_eapol.c kernel/src/wpa2_psk.c \
            kernel/src/wpa2_ccmp.c kernel/src/aes_ccm.c \
            kernel/src/sha256.c kernel/src/random.c \
            -o /tmp/nexus-wpa2-handshake-test
          /tmp/nexus-wpa2-handshake-test
      - name: Test DNS-independent HTTP framing parser
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/src/http.c kernel/tests/http_test.c -o /tmp/nexus-http-test
          /tmp/nexus-http-test
      - name: Test browser redirect URL resolution
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/src/browser_url.c kernel/tests/browser_url_test.c \
            -o /tmp/nexus-browser-url-test
          /tmp/nexus-browser-url-test
      - name: Test RTC date and epoch conversion
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/src/rtc.c kernel/tests/rtc_test.c -o /tmp/nexus-rtc-test
          /tmp/nexus-rtc-test
      - name: Test Wi-Fi state manager
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/src/wifi.c kernel/tests/wifi_test.c -o /tmp/nexus-wifi-test
          /tmp/nexus-wifi-test
      - name: Test 802.11 beacon and security parser
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/src/wifi_80211.c kernel/tests/wifi_80211_test.c \
            -o /tmp/nexus-wifi-80211-test
          /tmp/nexus-wifi-80211-test
      - name: Test SHA-256, HMAC and HKDF
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -Ikernel/src \
            kernel/src/sha256.c kernel/tests/sha256_test.c \
            -o /tmp/nexus-sha256-test
          /tmp/nexus-sha256-test
      - name: Test Nexus freestanding libc primitives
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror -fno-builtin \
            -Wno-format-truncation -Ikernel/src \
            kernel/tests/libc_test.c -o /tmp/nexus-libc-test
          /tmp/nexus-libc-test
      - name: Fetch and checksum-verify pinned Mbed TLS source
        run: sh toolchain/fetch-mbedtls.sh
      - name: Compile pinned Mbed TLS libraries
        run: |
          cmake -S build/deps/mbedtls-4.1.2 -B build/deps/mbedtls-build \
            -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DMBEDTLS_CONFIG_SET="MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG;MBEDTLS_PLATFORM_TIME_ALT;MBEDTLS_PLATFORM_GMTIME_R_ALT;MBEDTLS_PLATFORM_MS_TIME_ALT;MBEDTLS_PLATFORM_MEMORY;MBEDTLS_SSL_PROTO_TLS1_3" \
            -DMBEDTLS_CONFIG_UNSET="MBEDTLS_PSA_BUILTIN_GET_ENTROPY;MBEDTLS_NET_C;MBEDTLS_TIMING_C;MBEDTLS_SELF_TEST;MBEDTLS_FS_IO;MBEDTLS_DEBUG_C;MBEDTLS_AESNI_C;MBEDTLS_PSA_ITS_FILE_C;MBEDTLS_PSA_CRYPTO_STORAGE_C" \
          -DCMAKE_C_FLAGS="-D_GNU_SOURCE -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -include stdint.h"
          cmake --build build/deps/mbedtls-build --parallel 2
      - name: Test verified TLS 1.3 client adapter
        run: |
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 2 \
            -keyout /tmp/nexus-tls-test-key.pem \
            -out /tmp/nexus-tls-test-ca.pem \
            -subj "/CN=localhost" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,digitalSignature,keyCertSign,cRLSign" \
            -addext "subjectAltName=DNS:localhost"
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -DNEXUS_TLS_HEAP_HOST_TEST -Ikernel/src \
            -Ibuild/deps/mbedtls-build/generated/include \
            -Ibuild/deps/mbedtls-4.1.2/include \
            -Ibuild/deps/mbedtls-4.1.2/tf-psa-crypto/include \
            -Ibuild/deps/mbedtls-build/tf-psa-crypto/include \
            -Ibuild/deps/mbedtls-4.1.2/tf-psa-crypto/drivers/builtin/include \
            kernel/src/tls_heap.c kernel/src/mbedtls_heap.c \
            kernel/src/mbedtls_random.c kernel/src/mbedtls_time.c \
            kernel/src/tls_client.c kernel/tests/tls_client_test.c \
            -Lbuild/deps/mbedtls-build/library \
            -Lbuild/deps/mbedtls-build/tf-psa-crypto/library \
            -Wl,--start-group -lmbedtls -lmbedx509 -lmbedcrypto \
            -Wl,--end-group -o /tmp/nexus-tls-client-test
          /tmp/nexus-tls-client-test /tmp/nexus-tls-test-ca.pem
      - name: Test Nexus TCP-to-HTTPS transport bridge
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Ikernel/src \
            -Ibuild/deps/mbedtls-build/generated/include \
            -Ibuild/deps/mbedtls-4.1.2/include \
            -Ibuild/deps/mbedtls-4.1.2/tf-psa-crypto/include \
            -Ibuild/deps/mbedtls-build/tf-psa-crypto/include \
            -Ibuild/deps/mbedtls-4.1.2/tf-psa-crypto/drivers/builtin/include \
            kernel/src/net_https.c kernel/tests/net_https_test.c \
            -o /tmp/nexus-net-https-test
          /tmp/nexus-net-https-test

      - name: Test Nexus RNG adapter against Mbed TLS PSA API
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Ikernel/src \
            -Ibuild/deps/mbedtls-build/generated/include \
            -Ibuild/deps/mbedtls-4.1.2/include \
            -Ibuild/deps/mbedtls-4.1.2/tf-psa-crypto/include \
            -Ibuild/deps/mbedtls-build/tf-psa-crypto/include \
            -Ibuild/deps/mbedtls-4.1.2/tf-psa-crypto/drivers/builtin/include \
            kernel/src/random.c kernel/src/mbedtls_random.c \
            kernel/tests/mbedtls_random_test.c \
            -o /tmp/nexus-mbedtls-rng-test
          /tmp/nexus-mbedtls-rng-test
      - name: Test Nexus UTC clock adapter against Mbed TLS platform API
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Ikernel/src \
            -Ibuild/deps/mbedtls-build/generated/include \
            -Ibuild/deps/mbedtls-4.1.2/include \
            -Ibuild/deps/mbedtls-4.1.2/tf-psa-crypto/include \
            -Ibuild/deps/mbedtls-build/tf-psa-crypto/include \
            -Ibuild/deps/mbedtls-4.1.2/tf-psa-crypto/drivers/builtin/include \
            kernel/src/mbedtls_time.c kernel/tests/mbedtls_time_test.c \
            -o /tmp/nexus-mbedtls-time-test
          /tmp/nexus-mbedtls-time-test
      - name: Test bounded crypto heap allocator
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -DNEXUS_TLS_HEAP_HOST_TEST -Ikernel/src \
            kernel/src/tls_heap.c kernel/tests/tls_heap_test.c \
            -o /tmp/nexus-tls-heap-test
          /tmp/nexus-tls-heap-test
      - name: Test Mbed TLS heap integration
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -DNEXUS_TLS_HEAP_HOST_TEST -Ikernel/src \
            -Ibuild/deps/mbedtls-build/generated/include \
            -Ibuild/deps/mbedtls-4.1.2/include \
            -Ibuild/deps/mbedtls-4.1.2/tf-psa-crypto/include \
            -Ibuild/deps/mbedtls-build/tf-psa-crypto/include \
            -Ibuild/deps/mbedtls-4.1.2/tf-psa-crypto/drivers/builtin/include \
            kernel/src/tls_heap.c kernel/src/mbedtls_heap.c \
            kernel/tests/mbedtls_heap_test.c \
            -o /tmp/nexus-mbedtls-heap-test
          /tmp/nexus-mbedtls-heap-test
      - name: Build freestanding Mbed TLS libraries for Nexus
        run: |
          cmake -S build/deps/mbedtls-4.1.2 -B build/deps/mbedtls-kernel-build \
            -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DMBEDTLS_CONFIG_SET="MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG;MBEDTLS_PLATFORM_TIME_ALT;MBEDTLS_PLATFORM_GMTIME_R_ALT;MBEDTLS_PLATFORM_MS_TIME_ALT;MBEDTLS_PLATFORM_MEMORY;MBEDTLS_SSL_PROTO_TLS1_3" \
            -DMBEDTLS_CONFIG_UNSET="MBEDTLS_PSA_BUILTIN_GET_ENTROPY;MBEDTLS_NET_C;MBEDTLS_TIMING_C;MBEDTLS_SELF_TEST;MBEDTLS_FS_IO;MBEDTLS_DEBUG_C;MBEDTLS_AESNI_C;MBEDTLS_PSA_ITS_FILE_C;MBEDTLS_PSA_CRYPTO_STORAGE_C" \
            -DCMAKE_C_FLAGS="-O2 -D_GNU_SOURCE -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -include stdint.h -ffreestanding -fno-builtin -fno-stack-protector -fno-pic -fno-pie -fno-asynchronous-unwind-tables -fno-unwind-tables -m64 -march=x86-64 -mno-red-zone -mno-mmx -mno-sse -mno-sse2 -mgeneral-regs-only -mcmodel=kernel"
          cmake --build build/deps/mbedtls-kernel-build --parallel 2
      - name: Build freestanding kernel with verified HTTPS enabled
        run: make -C kernel clean all NEXUS_TLS=1
