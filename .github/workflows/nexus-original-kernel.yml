name: Nexus Original Kernel - BIOS and UEFI

on:
  push:
    branches:
      - nexus-original-kernel-roadmap
    paths:
      - "kernel/**"
      - "boot/**"
      - "build/**"
      - "installer/**"
      - ".github/workflows/nexus-original-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-original-kernel-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and boot-test Nexus x86-64 kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Nexus
        uses: actions/checkout@v4

      - name: Install build and emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils curl git xorriso qemu-system-x86 ovmf file

      - name: Test Nexus installer partition planner (host-only, no disk writes)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iinstaller installer/partition_plan.c \
            installer/tests/partition_plan_test.c \
            -o /tmp/nexus-partition-plan-test
          /tmp/nexus-partition-plan-test
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iinstaller installer/partition_plan.c installer/gpt_image.c \
            installer/tests/gpt_image_test.c \
            -o /tmp/nexus-gpt-image-test
          /tmp/nexus-gpt-image-test
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iinstaller installer/partition_plan.c installer/gpt_image.c \
            installer/gpt_install.c installer/tests/gpt_install_test.c \
            -o /tmp/nexus-gpt-install-test
          /tmp/nexus-gpt-install-test
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iinstaller installer/partition_plan.c installer/installer_core.c \
            installer/tests/installer_core_test.c \
            -o /tmp/nexus-installer-core-test
          /tmp/nexus-installer-core-test
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/blockdev.c kernel/src/gpt.c \
            kernel/tests/blockdev_identity_test.c \
            -o /tmp/nexus-blockdev-identity-test
          /tmp/nexus-blockdev-identity-test
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src -Iinstaller kernel/src/blockdev.c kernel/src/gpt.c \
            kernel/src/installer_storage.c kernel/src/boot_payload.c kernel/src/nxfs.c installer/partition_plan.c \
            installer/fat32_format.c installer/fat32_file.c installer/gpt_image.c installer/gpt_install.c \
            installer/tests/installer_storage_test.c \
            -o /tmp/nexus-installer-storage-test
          /tmp/nexus-installer-storage-test

      - name: Test installer boot-payload validation
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/include -Ikernel/src kernel/src/boot_payload.c \
            kernel/tests/boot_payload_test.c -o /tmp/nexus-boot-payload-test
          /tmp/nexus-boot-payload-test

      - name: Test FAT32 file deployment beyond 2 TiB
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iinstaller installer/fat32_file.c \
            installer/tests/fat32_file_large_lba_test.c \
            -o /tmp/nexus-fat32-large-lba-test
          /tmp/nexus-fat32-large-lba-test

      - name: Test FAT32 partition formatter
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iinstaller installer/fat32_format.c \
            installer/tests/fat32_format_test.c \
            -o /tmp/nexus-fat32-format-test
          /tmp/nexus-fat32-format-test

      - name: Build dual-mode ISO
        run: |
          chmod +x build/build-iso.sh
          EXTRA_CFLAGS="-DNEXUS_STORAGE_SELFTEST" ./build/build-iso.sh

      - name: Verify kernel ELF and ISO
        run: |
          file build/nexus-kernel.elf release/NexusOS-OriginalKernel-x86_64.iso
          readelf -h build/nexus-kernel.elf
          readelf -l build/nexus-kernel.elf
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Boot test - UEFI (OVMF)
        shell: bash
        run: |
          # Generic x86-64 baseline profile with both AHCI and NVMe controllers.
          truncate -s 256M nvme-test.img
          python3 build/create-gpt-test-image.py nvme-test.img
          set +e
          timeout -k 2s 12s qemu-system-x86_64 \
            -machine q35 -cpu qemu64 -m 512M \
            -netdev user,id=n0 -device e1000,netdev=n0 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive file=nvme-test.img,if=none,id=nvm0,format=raw \
            -device nvme,drive=nvm0,serial=NEXUSNVME0001 \
            -cdrom release/NexusOS-OriginalKernel-x86_64.iso \
            -boot d -display none -serial file:uefi-serial.log \
            -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          if [[ "$status" -ne 124 && "$status" -ne 137 && "$status" -ne 0 ]]; then
            echo "UEFI QEMU exited unexpectedly: $status"
            exit "$status"
          fi
          cat uefi-serial.log
          grep -q "BOOT MEDIA: optical source is not a registered disk" uefi-serial.log
          grep -q "NEXUS GDT TSS READY" uefi-serial.log
          grep -q "NEXUS ELF64 VALIDATION READY" uefi-serial.log
          grep -q "NEXUS USER MODE SELFTEST READY" uefi-serial.log
          grep -q "NEXUS RAMFS READY" uefi-serial.log
          grep -q "NEXUS PROCESS MANAGER READY" uefi-serial.log
          grep -q "NEXUS FILE EXEC OK" uefi-serial.log
          grep -q "NEXUS FILE PROCESS SELFTEST READY" uefi-serial.log
          grep -q "NEXUS ELF64 USER LOADER READY" uefi-serial.log
          grep -q "NEXUS SYSCALL ABI READY" uefi-serial.log
          grep -q "NEXUS PAGE RECLAIM READY" uefi-serial.log
          grep -q "NEXUS NX PAGE PROTECTION READY" uefi-serial.log
          grep -q "NEXUS USER MODE" uefi-serial.log
          grep -q "K2: hardware timer ticks received:" uefi-serial.log
          grep -q "NEXUS K2 TIMER INTERRUPT READY" uefi-serial.log
          grep -q "NEXUS ACPI MADT READY" uefi-serial.log
          grep -q "NEXUS DMA32 PAGE ALLOCATOR READY" uefi-serial.log
          grep -q "NEXUS PCI DISCOVERY READY" uefi-serial.log
          grep -q "NEXUS E1000 TX READY" uefi-serial.log
          grep -q "NEXUS DHCP READY" uefi-serial.log
          grep -q "PCI: functions discovered:" uefi-serial.log
          grep -q "NEXUS IOAPIC PROBE READY" uefi-serial.log
          grep -q "NEXUS STORAGE DISCOVERY READY" uefi-serial.log
          grep -q "STORAGE: controller " uefi-serial.log
          grep -q "STORAGE: controller NVMe" uefi-serial.log
          grep -q "NEXUS NVME IDENTIFY READY" uefi-serial.log
          grep -q "NVMe: model:" uefi-serial.log
          grep -q "NEXUS NVME NAMESPACE READY" uefi-serial.log
          grep -q "NVMe: namespace count:" uefi-serial.log
          grep -q "NVMe: namespace logical block bytes:" uefi-serial.log
          grep -q "NEXUS NVME BLOCK DEVICE READY" uefi-serial.log
          grep -q "NEXUS NVME WRITE SELFTEST READY" uefi-serial.log
          grep -q "NEXUS NXFS JOURNAL READY" uefi-serial.log
          grep -q "NEXUS NXFS VFS READY" uefi-serial.log
          grep -q "NVMe: blockdev_read verified LBAs 0 and 1" uefi-serial.log
          grep -q "GPT: validated header and entry CRCs; discovered test partition" uefi-serial.log
          grep -q "NEXUS GPT READ ONLY READY" uefi-serial.log
          grep -q "FAT32: mounted volume, listed and read README.TXT" uefi-serial.log
          grep -q "NEXUS FAT32 READ ONLY READY" uefi-serial.log
          grep -q "VFS: listed README.TXT and read file contents" uefi-serial.log
          grep -q "PCI: functions discovered:" uefi-serial.log
          grep -q "NEXUS AHCI REGISTER PROBE READY" uefi-serial.log
          grep -q "NEXUS AHCI PORT DISCOVERY READY" uefi-serial.log
          grep -q "AHCI: connected ports:" uefi-serial.log
          grep -q "AHCI: ports implemented:" uefi-serial.log
          grep -q "NEXUS K2 PREEMPTIVE THREAD SCHEDULER READY" uefi-serial.log
          grep -q "NEXUS DESKTOP FRAMEBUFFER READY" uefi-serial.log
          grep -q "NEXUS KEYBOARD INPUT READY" uefi-serial.log
          grep -q "NEXUS K0 BOOT COMPLETE" uefi-serial.log

      - name: Resolve exception IP from UEFI log
        if: always()
        shell: bash
        run: |
          if [[ -f uefi-serial.log ]]; then
            python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          log = Path("uefi-serial.log").read_text(errors="replace")
          matches = [
              line.split("Instruction pointer:", 1)[1].strip()
              for line in log.splitlines()
              if "Instruction pointer:" in line
          ]
          if not matches:
              print("No CPU exception IP recorded.")
              raise SystemExit(0)
          target = int(matches[-1], 16)
          symbols = subprocess.check_output(
              ["nm", "-n", "build/nexus-kernel.elf"], text=True
          ).splitlines()
          previous = None
          following = None
          for line in symbols:
              parts = line.split(maxsplit=2)
              if len(parts) < 3:
                  continue
              try:
                  address = int(parts[0], 16)
              except ValueError:
                  continue
              if address <= target:
                  previous = (address, parts[1], parts[2])
              elif following is None:
                  following = (address, parts[1], parts[2])
                  break
          print(f"Exception IP: 0x{target:016x}")
          print("Nearest preceding symbol:", previous)
          print("Next symbol:", following)
          print("addr2line:")
          print(subprocess.check_output(
              ["addr2line", "-f", "-C", "-e", "build/nexus-kernel.elf",
               hex(target)], text=True
          ))
          PY
          fi

      - name: Boot test - legacy BIOS (SeaBIOS)
        shell: bash
        run: |
          set +e
          timeout -k 2s 12s qemu-system-x86_64 \
            -machine pc -cpu max -m 512M \
            -netdev user,id=n0 -device e1000,netdev=n0 \
            -cdrom release/NexusOS-OriginalKernel-x86_64.iso \
            -boot d -display none -serial file:bios-serial.log \
            -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          if [[ "$status" -ne 124 && "$status" -ne 0 ]]; then
            echo "BIOS QEMU exited unexpectedly: $status"
            exit "$status"
          fi
          cat bios-serial.log
          grep -q "BOOT MEDIA: optical source is not a registered disk" bios-serial.log
          grep -q "NEXUS GDT TSS READY" bios-serial.log
          grep -q "NEXUS ELF64 VALIDATION READY" bios-serial.log
          grep -q "NEXUS USER MODE SELFTEST READY" bios-serial.log
          grep -q "NEXUS RAMFS READY" bios-serial.log
          grep -q "NEXUS PROCESS MANAGER READY" bios-serial.log
          grep -q "NEXUS ELF64 USER LOADER READY" bios-serial.log
          grep -q "NEXUS SYSCALL ABI READY" bios-serial.log
          grep -q "NEXUS PAGE RECLAIM READY" bios-serial.log
          grep -q "NEXUS NX PAGE PROTECTION READY" bios-serial.log
          grep -q "NEXUS USER MODE" bios-serial.log
          grep -q "K2: hardware timer ticks received:" bios-serial.log
          grep -q "NEXUS K2 TIMER INTERRUPT READY" bios-serial.log
          grep -q "NEXUS ACPI MADT READY" bios-serial.log
          grep -q "NEXUS DMA32 PAGE ALLOCATOR READY" bios-serial.log
          grep -q "NEXUS PCI DISCOVERY READY" bios-serial.log
          grep -q "NEXUS E1000 TX READY" bios-serial.log
          grep -q "NEXUS DHCP READY" bios-serial.log
          grep -q "PCI: functions discovered:" bios-serial.log
          grep -q "NEXUS IOAPIC PROBE READY" bios-serial.log
          grep -q "NEXUS STORAGE DISCOVERY READY" bios-serial.log
          grep -q "STORAGE: controller " bios-serial.log
          grep -q "NEXUS K2 PREEMPTIVE THREAD SCHEDULER READY" bios-serial.log
          grep -q "NEXUS K0 BOOT COMPLETE" bios-serial.log

      - name: Build distributable ISO without CI-only disk read
        run: |
          ./build/build-iso.sh
          file build/nexus-kernel.elf release/NexusOS-OriginalKernel-x86_64.iso
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Boot-check distributable ISO without automatic sector reads
        shell: bash
        run: |
          set +e
          timeout -k 2s 15s qemu-system-x86_64 \
            -machine q35 -cpu qemu64 -m 512M \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive file=nvme-test.img,if=none,id=nvm0,format=raw \
            -device nvme,drive=nvm0,serial=NEXUSNVME0001 \
            -cdrom release/NexusOS-OriginalKernel-x86_64.iso \
            -boot d -display none -serial file:release-serial.log \
            -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          if [[ "$status" -ne 124 && "$status" -ne 0 ]]; then
            echo "Release UEFI QEMU exited unexpectedly: $status"
            exit "$status"
          fi
          cat release-serial.log
          grep -q "BOOT MEDIA: optical source is not a registered disk" release-serial.log
          grep -q "NEXUS NVME BLOCK DEVICE READY" release-serial.log
          grep -q "NEXUS ELF64 VALIDATION READY" release-serial.log
          grep -q "NEXUS RAMFS READY" release-serial.log
          grep -q "NEXUS PROCESS MANAGER READY" release-serial.log
          grep -q "NEXUS ELF64 USER LOADER READY" release-serial.log
          grep -q "NEXUS SYSCALL ABI READY" release-serial.log
          grep -q "NEXUS PAGE RECLAIM READY" release-serial.log
          grep -q "NEXUS NX PAGE PROTECTION READY" release-serial.log
          grep -q "NEXUS NVME IDENTIFY READY" release-serial.log
          if grep -q "NEXUS NVME WRITE SELFTEST READY" release-serial.log; then
            echo "Release ISO unexpectedly ran CI sector-read self-test"
            exit 1
          fi

      - name: Upload original-kernel prototype
        uses: actions/upload-artifact@v4
        with:
          name: NexusOS-OriginalKernel-BIOS-UEFI
          path: |
            release/NexusOS-OriginalKernel-x86_64.iso
            release/SHA256SUMS.txt
            build/nexus-kernel.elf
          if-no-files-found: error
          retention-days: 30
