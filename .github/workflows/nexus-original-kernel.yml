              if os.path.exists(log_path):
                  log = open(log_path, encoding="utf-8", errors="replace").read()
                  if "NEXUS K0 BOOT COMPLETE" in log and "NEXUS DESKTOP FRAMEBUFFER READY" in log:
                      break
              time.sleep(1)
          else:
              raise SystemExit("Installed desktop did not boot for persistent-file test")

          sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          sock.settimeout(10)
          sock.connect("/tmp/nexus-sata-files-qmp.sock")
          stream = sock.makefile("rwb", buffering=0)
          json.loads(stream.readline())

          def command(payload):
              stream.write(json.dumps(payload).encode() + b"\r\n")
              while True:
                  result = json.loads(stream.readline())
                  if "return" in result or "error" in result:
                      if "error" in result:
                          raise RuntimeError(result["error"])
                      return result["return"]

          command({"execute": "qmp_capabilities"})

          def key(name):
              command({"execute": "human-monitor-command",
                       "arguments": {"command-line": f"sendkey {name} 90"}})
              time.sleep(0.16)

          key("f1")
          key("n")
          for char in "nexus-long-persistent-note":
              key("minus" if char == "-" else char)
          key("ret")
          for char in "nexus-data-saved":
              key("minus" if char == "-" else char)
          key("f10")
          deadline = time.time() + 15
          while time.time() < deadline:
              log = open(log_path, encoding="utf-8", errors="replace").read()
              if "FILES: entry NEXUS-LONG-PERSISTENT-NOTE size=16" in log:
                  break
              if "FILES: SAVE FAILED" in log or "FILES: SAVED VOLATILE RAM" in log:
                  print(log)
                  raise SystemExit("File save did not reach persistent NXFS")
              time.sleep(0.5)
          else:
              print(open(log_path, encoding="utf-8", errors="replace").read())
              raise SystemExit("Persistent file save was not observed")
          sock.close()
          PY
          kill "$QEMU_PID" 2>/dev/null || true
          wait "$QEMU_PID" 2>/dev/null || true
          trap - EXIT
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/nexus-sata-files-reboot-vars.fd
          rm -f /tmp/nexus-sata-files-reboot-qmp.sock nexus-sata-files-reboot-serial.log
          qemu-system-x86_64 \
            -machine q35 -cpu qemu64 -m 512M \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=/tmp/nexus-sata-files-reboot-vars.fd \
            -drive file=/tmp/nexus-sata-target.img,if=ide,index=0,format=raw \
            -boot order=c -display none -serial file:nexus-sata-files-reboot-serial.log \
            -qmp unix:/tmp/nexus-sata-files-reboot-qmp.sock,server,nowait \
            -monitor none -no-reboot -no-shutdown >/tmp/nexus-sata-files-reboot-qemu.log 2>&1 &
          QEMU_PID=$!
          trap 'kill "$QEMU_PID" 2>/dev/null || true; wait "$QEMU_PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json, os, socket, time

          log_path = "nexus-sata-files-reboot-serial.log"
          deadline = time.time() + 90
          while time.time() < deadline:
              if os.path.exists(log_path):
                  log = open(log_path, encoding="utf-8", errors="replace").read()
                  if "NEXUS K0 BOOT COMPLETE" in log and "NEXUS DESKTOP FRAMEBUFFER READY" in log:
                      break
              time.sleep(1)
          else:
              raise SystemExit("Installed desktop did not reboot for persistence check")

          sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          sock.settimeout(10)
          sock.connect("/tmp/nexus-sata-files-reboot-qmp.sock")
          stream = sock.makefile("rwb", buffering=0)
          json.loads(stream.readline())

          def command(payload):
              stream.write(json.dumps(payload).encode() + b"\r\n")
              while True:
                  result = json.loads(stream.readline())
                  if "return" in result or "error" in result:
                      if "error" in result:
                          raise RuntimeError(result["error"])
                      return result["return"]

          command({"execute": "qmp_capabilities"})
          command({"execute": "human-monitor-command",
                   "arguments": {"command-line": "sendkey f1 90"}})
          deadline = time.time() + 15
          while time.time() < deadline:
              log = open(log_path, encoding="utf-8", errors="replace").read()
              if "FILES: entry NEXUS-LONG-PERSISTENT-NOTE" in log:
                  break
              time.sleep(0.5)
          else:
              print(open(log_path, encoding="utf-8", errors="replace").read())
              raise SystemExit("Saved file was not present after reboot")
          sock.close()
          PY
          cat nexus-sata-files-serial.log nexus-sata-files-reboot-serial.log
          grep -q "FILES: mounted persistent Nexus user Data volume on" nexus-sata-files-serial.log
          grep -q "FILES: SAVED PERSISTENT NXFS NEXUS-LONG-PERSISTENT-NOTE" nexus-sata-files-serial.log
          grep -q "FILES: entry NEXUS-LONG-PERSISTENT-NOTE size=16" nexus-sata-files-reboot-serial.log
          kill "$QEMU_PID" 2>/dev/null || true
          wait "$QEMU_PID" 2>/dev/null || true
          trap - EXIT

      
      - name: Build installable distributable ISO without CI-only disk read
        run: |
          EXTRA_CFLAGS="-DNEXUS_INSTALLER_ENABLE_DESTRUCTIVE_WRITES" ./build/build-iso.sh
          file build/nexus-kernel.elf release/NexusOS-OriginalKernel-x86_64.iso
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Boot-check distributable ISO without automatic sector reads
        shell: bash
        run: |
          set +e
          timeout -k 2s 24s qemu-system-x86_64 \
            -machine q35 -cpu qemu64 -m 512M \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive file=nvme-test.img,if=none,id=nvm0,format=raw \
            -device nvme,drive=nvm0,serial=NEXUSNVME0001 \
            -cdrom release/NexusOS-OriginalKernel-x86_64.iso \
            -boot d -display none -serial file:release-serial.log \
            -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          if [[ "$status" -ne 124 && "$status" -ne 0 ]]; then
            echo "Release UEFI QEMU exited unexpectedly: $status"
            exit "$status"
          fi
          cat release-serial.log
          grep -q "BOOT MEDIA: optical source is not a registered disk" release-serial.log
          grep -q "NEXUS NVME BLOCK DEVICE READY" release-serial.log
          grep -q "NEXUS INSTALLER WRITE GATE ENABLED" release-serial.log
          grep -q "NEXUS ELF64 STATIC-PIE VALIDATION READY" release-serial.log
          grep -q "NEXUS RAMFS READY" release-serial.log
          grep -q "NEXUS PROCESS MANAGER READY" release-serial.log
          grep -q "NEXUS ELF64 USER LOADER READY" release-serial.log
          grep -q "NEXUS SYSCALL ABI READY" release-serial.log
          grep -q "NEXUS PAGE RECLAIM READY" release-serial.log
          grep -q "NEXUS NX PAGE PROTECTION READY" release-serial.log
          grep -q "NEXUS NVME IDENTIFY READY" release-serial.log
          if grep -q "NEXUS NVME WRITE SELFTEST READY" release-serial.log; then
            echo "Release ISO unexpectedly ran CI sector-read self-test"
            exit 1
          fi

      - name: Upload original-kernel prototype
        uses: actions/upload-artifact@v4
        with:
          name: NexusOS-OriginalKernel-BIOS-UEFI
          path: |
            release/NexusOS-OriginalKernel-x86_64.iso
            release/SHA256SUMS.txt
            build/nexus-kernel.elf
          if-no-files-found: error
          retention-days: 30
