name: Nexus Original Kernel - BIOS and UEFI

on:
  push:
    branches:
      - nexus-original-kernel-roadmap
    paths:
      - "kernel/**"
      - "boot/**"
      - "build/**"
      - "installer/**"
      - "userland/**"
      - ".github/workflows/nexus-original-kernel.yml"
  pull_request:
    branches:
      - nexus-original-kernel-roadmap
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-original-kernel-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and boot-test Nexus x86-64 kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Nexus
        uses: actions/checkout@v4

      - name: Install build and emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils curl git xorriso qemu-system-x86 ovmf file dosfstools mtools

      - name: Test durable installer recovery journal (host-only mock disk)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iinstaller installer/installer_journal.c \
            installer/tests/installer_journal_test.c \
            -o /tmp/nexus-installer-journal-test
          /tmp/nexus-installer-journal-test

      - name: Test Nexus installer partition planner (host-only, no disk writes)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iinstaller installer/partition_plan.c \
            installer/tests/partition_plan_test.c \
            -o /tmp/nexus-partition-plan-test
          /tmp/nexus-partition-plan-test
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iinstaller installer/partition_plan.c installer/gpt_image.c \
            installer/tests/gpt_image_test.c \
            -o /tmp/nexus-gpt-image-test
          /tmp/nexus-gpt-image-test
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iinstaller installer/partition_plan.c installer/gpt_image.c \
            installer/gpt_install.c installer/tests/gpt_install_test.c \
            -o /tmp/nexus-gpt-install-test
          /tmp/nexus-gpt-install-test
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iinstaller installer/partition_plan.c installer/installer_core.c \
            installer/tests/installer_core_test.c \
            -o /tmp/nexus-installer-core-test
          /tmp/nexus-installer-core-test
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/blockdev.c kernel/src/gpt.c \
            kernel/tests/blockdev_identity_test.c \
            -o /tmp/nexus-blockdev-identity-test
          /tmp/nexus-blockdev-identity-test
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/blockdev.c \
            kernel/tests/blockdev_data_write_test.c \
            -o /tmp/nexus-blockdev-data-write-test
          /tmp/nexus-blockdev-data-write-test
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src -Ikernel/include -Iinstaller kernel/src/blockdev.c kernel/src/gpt.c \
            kernel/src/installer_storage.c kernel/src/installer_runtime.c \
            kernel/src/boot_payload.c kernel/src/boot_pack.c kernel/src/nxfs.c installer/installer_journal.c installer/partition_plan.c \
            installer/fat32_format.c installer/fat32_file.c installer/bios_install.c installer/gpt_image.c installer/gpt_install.c \
            installer/tests/installer_storage_test.c \
            -o /tmp/nexus-installer-storage-test
          /tmp/nexus-installer-storage-test

      - name: Test installer-only ISO boot selection
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/boot_mode.c \
            kernel/tests/boot_mode_test.c -o /tmp/nexus-boot-mode-test
          /tmp/nexus-boot-mode-test
          grep -q '^/Install Nexus OS$' boot/limine.conf
          grep -q 'cmdline: nexus.mode=installer' boot/limine.conf
          grep -q 'module_path: boot():/NEXUS/SYSTEM.NXP' boot/limine.conf
          grep -q 'default_entry: 1' boot/limine.conf
          grep -q 'remember_last_entry: no' boot/limine.conf
          ! grep -q 'nexus.mode=desktop' boot/limine.conf

      - name: Test USB HID boot-keyboard decoder
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/usb_hid.c \
            kernel/tests/usb_hid_keyboard_test.c \
            -o /tmp/nexus-usb-hid-keyboard-test
          /tmp/nexus-usb-hid-keyboard-test

      - name: Test USB HID boot-mouse decoder
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/usb_hid.c \
            kernel/tests/usb_hid_mouse_test.c \
            -o /tmp/nexus-usb-hid-mouse-test
          /tmp/nexus-usb-hid-mouse-test

      - name: Test xHCI root-port discovery bounds and PORTSC helpers
        run: |
          test -s kernel/src/xhci_ports.h
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/tests/xhci_ports_test.c \
            -o /tmp/nexus-xhci-ports-test
          /tmp/nexus-xhci-ports-test

      - name: Test xHCI USB 2.0, SuperSpeed and SuperSpeedPlus link handling
        run: |
          test -s kernel/src/xhci_speed.h
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/tests/xhci_speed_test.c \
            -o /tmp/nexus-xhci-speed-test
          /tmp/nexus-xhci-speed-test

      - name: Test xHCI firmware BIOS-to-OS ownership handoff
        run: |
          test -s kernel/src/xhci_ownership.h
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/tests/xhci_ownership_test.c \
            -o /tmp/nexus-xhci-ownership-test
          /tmp/nexus-xhci-ownership-test

      - name: Test bounded AC97 PCM DMA descriptor format
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/ac97_format.c \
            kernel/tests/ac97_format_test.c \
            -o /tmp/nexus-ac97-format-test
          /tmp/nexus-ac97-format-test

      - name: Test generic USB HID gamepad descriptor parsing
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/usb_hid.c \
            kernel/tests/usb_hid_gamepad_test.c \
            -o /tmp/nexus-usb-hid-gamepad-test
          /tmp/nexus-usb-hid-gamepad-test

      - name: Test generic USB HID keyboard and mouse report protocols
        run: |
          test -s kernel/src/usb_hid_generic.h
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/usb_hid_generic.c \
            kernel/tests/usb_hid_generic_test.c \
            -o /tmp/nexus-usb-hid-generic-test
          /tmp/nexus-usb-hid-generic-test

      - name: Test gamepad input queue and overflow behavior
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -DNEXUS_INPUT_HOST_TEST -Ikernel/src \
            kernel/src/input.c kernel/src/usb_hid.c \
            kernel/tests/usb_gamepad_input_test.c \
            -o /tmp/nexus-usb-gamepad-input-test
          /tmp/nexus-usb-gamepad-input-test

      - name: Test USB mouse desktop input queue
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -DNEXUS_INPUT_HOST_TEST -Ikernel/src \
            kernel/src/input.c kernel/src/usb_hid.c \
            kernel/tests/usb_mouse_input_test.c \
            -o /tmp/nexus-usb-mouse-input-test
          /tmp/nexus-usb-mouse-input-test

      - name: Test PS/2 extended keyboard sequences and IntelliMouse wheel
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -DNEXUS_INPUT_HOST_TEST -Ikernel/src \
            kernel/src/input.c kernel/src/usb_hid.c \
            kernel/tests/ps2_input_test.c \
            -o /tmp/nexus-ps2-input-test
          /tmp/nexus-ps2-input-test

      - name: Test GPU adapter discovery and safe CPU fallback
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/gpu.c kernel/tests/gpu_test.c \
            -o /tmp/nexus-gpu-test
          /tmp/nexus-gpu-test

      - name: Test firmware inventory and SMBIOS checksum handling
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/firmware.c kernel/tests/firmware_test.c \
            -o /tmp/nexus-firmware-test
          /tmp/nexus-firmware-test

      - name: Test ACPI MCFG validation and PCIe segment ranges
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/include -Ikernel/src kernel/src/acpi.c \
            kernel/tests/acpi_mcfg_test.c -o /tmp/nexus-acpi-mcfg-test
          /tmp/nexus-acpi-mcfg-test

      - name: Test PCI standard and extended capability list parsing
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/pci_caps.c \
            kernel/tests/pci_caps_test.c -o /tmp/nexus-pci-caps-test
          /tmp/nexus-pci-caps-test

      - name: Test VirtIO split-queue layout and PCI notification addressing
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/tests/virtio_queue_helpers_test.c \
            -o /tmp/nexus-virtio-queue-helpers-test
          /tmp/nexus-virtio-queue-helpers-test

      - name: Test Limine BIOS boot-sector and stage-2 installation
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iinstaller installer/bios_install.c installer/tests/bios_install_test.c \
            -o /tmp/nexus-bios-install-test
          /tmp/nexus-bios-install-test

      - name: Test installer boot-payload validation
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/include -Ikernel/src kernel/src/boot_payload.c \
            kernel/tests/boot_payload_test.c -o /tmp/nexus-boot-payload-test
          /tmp/nexus-boot-payload-test

      - name: Test Nexus read-only system pack validation and access
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/boot_pack.c kernel/tests/boot_pack_test.c \
            -o /tmp/nexus-boot-pack-test
          /tmp/nexus-boot-pack-test
          python3 build/test-system-pack.py

      - name: Test FAT32 file deployment beyond 2 TiB
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iinstaller installer/fat32_file.c \
            installer/tests/fat32_file_large_lba_test.c \
            -o /tmp/nexus-fat32-large-lba-test
          /tmp/nexus-fat32-large-lba-test

      - name: Test FAT32 mount, long names and directory chains
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/fat32.c \
            kernel/tests/fat32_mount_test.c -o /tmp/nexus-fat32-test
          /tmp/nexus-fat32-test

      - name: Test FAT32 partition formatter
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iinstaller installer/fat32_format.c \
            installer/tests/fat32_format_test.c \
            -o /tmp/nexus-fat32-format-test
          /tmp/nexus-fat32-format-test

      - name: Build first-party Nexus native application SDK
        run: |
          make -C sdk clean all CC=gcc
          python3 build/make-system-pack.py \
            --output build/system-pack/NEXUS-SYSTEM.NXP \
            --file NEXUS-README.TXT=system/README.TXT \
            --file NEXUS-APPS.TXT=system/APPS.TXT \
            --file KINETIC.ELF=sdk/build/kinetic_demo.elf \
            --file GAMEPAD.ELF=sdk/build/gamepad_demo.elf \
            --file AUDIO.ELF=sdk/build/audio_demo.elf \
            --file PIE.ELF=sdk/build/pie_demo.elf
          make -C userland inspect
          python3 - <<'PY'
          from pathlib import Path
          import struct
          image = Path("build/userland/HELLO.ELF").read_bytes()
          assert len(image) <= 4096, "test app must fit in eight FAT32 clusters"
          assert image[:4] == b"\x7fELF" and image[4] == 2 and image[5] == 1
          assert struct.unpack_from("<H", image, 18)[0] == 62
          print(f"Nexus native SDK sample: {len(image)} byte x86-64 ELF64")
          PY

      - name: Build dual-mode ISO
        run: |
          chmod +x build/build-iso.sh
          EXTRA_CFLAGS="-DNEXUS_STORAGE_SELFTEST -DNEXUS_INSTALLER_ENABLE_DESTRUCTIVE_WRITES" ./build/build-iso.sh

      - name: Install boot payloads to a disposable disk and boot installed UEFI target via USB mass storage
        shell: bash
        run: |
          /tmp/nexus-installer-storage-test build/nexus-kernel.elf \
            build/limine-binary/BOOTX64.EFI build/limine-binary/limine-bios-hdd.bin \
            build/limine-binary/limine-bios.sys build/system-pack/NEXUS-SYSTEM.NXP \
            /tmp/nexus-installed-uefi.img
          echo "Installed disk MBR:"
          od -An -tx1 -N512 /tmp/nexus-installed-uefi.img
          echo "Installed disk GPT header signature:"
          od -An -tc -j512 -N8 /tmp/nexus-installed-uefi.img
          echo "Installed disk GPT partition entry 0:"
          od -An -tx1 -j1024 -N128 /tmp/nexus-installed-uefi.img
          sfdisk --dump /tmp/nexus-installed-uefi.img || true
          dd if=/tmp/nexus-installed-uefi.img of=/tmp/nexus-installed-esp.img \
            bs=512 skip=2048 count=1048576 status=none
          fsck.fat -n /tmp/nexus-installed-esp.img || true
          mdir -i /tmp/nexus-installed-esp.img ::/EFI/BOOT
          mdir -i /tmp/nexus-installed-esp.img ::/boot/limine
          mtype -i /tmp/nexus-installed-esp.img ::/boot/limine/limine.conf > /tmp/nexus-installed-limine.conf
          grep -q '^/Nexus OS - Installed Desktop$' /tmp/nexus-installed-limine.conf
          grep -q 'cmdline: nexus.mode=desktop' /tmp/nexus-installed-limine.conf
          ! grep -q 'nexus.mode=installer' /tmp/nexus-installed-limine.conf
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/nexus-installed-uefi-vars.fd
          set +e
          timeout -k 2s 18s qemu-system-x86_64 \
            -machine q35 -cpu qemu64 -m 512M \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=/tmp/nexus-installed-uefi-vars.fd \
            -drive file=/tmp/nexus-installed-uefi.img,if=none,id=installed,format=raw \
            -device qemu-xhci,id=xhci \
            -device usb-storage,bus=xhci.0,drive=installed,bootindex=1 \
            -boot order=c -display none -serial file:installed-uefi-serial.log \
            -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          if [[ "$status" -ne 124 && "$status" -ne 137 && "$status" -ne 0 ]]; then
            echo "Installed-disk UEFI QEMU exited unexpectedly: $status"
            exit "$status"
          fi
          cat installed-uefi-serial.log
          grep -q "INSTALLER: verified kernel, UEFI loader, BIOS stage-2, and system-pack payloads available" installed-uefi-serial.log
          grep -q "NEXUS K0 BOOT COMPLETE" installed-uefi-serial.log

      - name: Boot the installed legacy BIOS target disk (SeaBIOS)
        shell: bash
        run: |
          set +e
          timeout -k 2s 18s qemu-system-x86_64 \
            -machine pc -cpu qemu64 -m 512M \
            -drive file=/tmp/nexus-installed-uefi.img,if=ide,index=0,format=raw \
            -boot c -display none -serial file:installed-bios-serial.log \
            -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          if [[ "$status" -ne 124 && "$status" -ne 137 && "$status" -ne 0 ]]; then
            echo "Installed-disk BIOS QEMU exited unexpectedly: $status"
            exit "$status"
          fi
          cat installed-bios-serial.log
          grep -q "INSTALLER: verified kernel, UEFI loader, BIOS stage-2, and system-pack payloads available" installed-bios-serial.log
          grep -q "NEXUS K0 BOOT COMPLETE" installed-bios-serial.log

      - name: Verify kernel ELF and ISO
        run: |
          file build/nexus-kernel.elf release/NexusOS-OriginalKernel-x86_64.iso
          readelf -h build/nexus-kernel.elf
          readelf -l build/nexus-kernel.elf
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Boot test - UEFI (OVMF)
        shell: bash
        run: |
          # QEMU max exposes AVX/AVX2 so OS-managed XSAVE is exercised in CI.
          truncate -s 256M nvme-test.img ahci-test.img
          python3 build/create-gpt-test-image.py nvme-test.img build/userland/HELLO.ELF
          python3 build/create-gpt-test-image.py ahci-test.img build/userland/HELLO.ELF
          set +e
          timeout -k 2s 24s qemu-system-x86_64 \
            -machine q35 -cpu max -smp 4 -m 512M \
            -netdev user,id=n0 -device e1000,netdev=n0 \
            -netdev user,id=virt0 -device virtio-net-pci,netdev=virt0,disable-legacy=on \
            -device virtio-gpu-pci,disable-legacy=on \
            -audiodev none,id=audio0 \
            -device AC97,audiodev=audio0 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive file=nvme-test.img,if=none,id=nvm0,format=raw \
            -device nvme,drive=nvm0,serial=NEXUSNVME0001 \
            -drive file=ahci-test.img,if=ide,index=0,format=raw \
            -device qemu-xhci,id=xhci \
            -device usb-kbd,bus=xhci.0 \
            -device usb-mouse,bus=xhci.0 \
            -cdrom release/NexusOS-OriginalKernel-x86_64.iso \
            -boot d -display none -serial file:uefi-serial.log \
            -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          if [[ "$status" -ne 124 && "$status" -ne 137 && "$status" -ne 0 ]]; then
            echo "UEFI QEMU exited unexpectedly: $status"
            exit "$status"
          fi
          cat uefi-serial.log
          grep -q "BOOT MEDIA: optical source is not a registered disk" uefi-serial.log
          grep -q "NEXUS GDT TSS READY" uefi-serial.log
          grep -q "CPU: XSAVE AVX/YMM state enabled for native apps" uefi-serial.log
          grep -Eq "NEXUS AC97 AUDIO READY|AUDIO: no supported AC97 device initialized" uefi-serial.log
          grep -q "INSTALLER: verified kernel, UEFI loader, BIOS stage-2, and system-pack payloads available" uefi-serial.log
          grep -q "NEXUS ELF64 STATIC-PIE VALIDATION READY" uefi-serial.log
          grep -q "NEXUS USER MODE SELFTEST READY" uefi-serial.log
          grep -q "NEXUS STORE BUNDLED APP SELFTEST READY" uefi-serial.log
          grep -q "NEXUS RAMFS READY" uefi-serial.log
          grep -q "NEXUS PROCESS MANAGER READY" uefi-serial.log
          # The CI image attaches disposable NVMe/AHCI test volumes. The
          # installer-mode boot therefore exercises the disk-backed native
          # ELF process and its file-write/output-capture ABI end to end.
          grep -q "NEXUS BOOT MODE: DEDICATED INSTALLER" uefi-serial.log
          grep -q "NEXUS FILE EXEC OK; SDK FILE IO/WRITE OK; FORMAT=0023" uefi-serial.log
          grep -q "DESKTOP: HELLO.ELF native SDK file read/write, formatted output and capture passed" uefi-serial.log
          grep -q "NEXUS CPU CAPABILITY QUERY READY" uefi-serial.log
          grep -q "NEXUS AVX2 USER SIMD READY" uefi-serial.log
          grep -q "NEXUS SMP NATIVE APP CAPABILITY READY" uefi-serial.log
          grep -q "NEXUS FILE PROCESS SELFTEST READY" uefi-serial.log
          ! grep -q "NEXUS FILE PROCESS SELFTEST SKIPPED" uefi-serial.log
          ! grep -q "NEXUS CPU EXCEPTION" uefi-serial.log
          grep -q "NEXUS SMP ONLINE CPU COUNT=0x0000000000000004" uefi-serial.log
          grep -q "NEXUS SMP PARALLEL WORK TEST READY" uefi-serial.log
          grep -q "NEXUS SMP ONLINE CPU COUNT=0x0000000000000004" uefi-serial.log
          grep -q "NEXUS ELF64 USER LOADER READY" uefi-serial.log
          grep -q "NEXUS SYSCALL ABI READY" uefi-serial.log
          grep -q "NEXUS PAGE RECLAIM READY" uefi-serial.log
          grep -q "NEXUS NX PAGE PROTECTION READY" uefi-serial.log
          grep -q "NEXUS USER MODE" uefi-serial.log
          grep -q "K2: hardware timer ticks received:" uefi-serial.log
          grep -q "NEXUS K2 TIMER INTERRUPT READY" uefi-serial.log
          grep -q "K2: timed worker sleep, wakeup and CPU yielding passed" uefi-serial.log
          grep -q "NEXUS USER SLEEP SYSCALL SCHEDULER INTEGRATION READY" uefi-serial.log
          grep -q "NEXUS ACPI MADT READY" uefi-serial.log
          grep -q "NEXUS DMA32 PAGE ALLOCATOR READY" uefi-serial.log
          grep -q "NEXUS USB HID KEYBOARD READY" uefi-serial.log
          grep -q "NEXUS USB HID MOUSE READY" uefi-serial.log
          grep -q "INPUT: USB HID boot keyboard available" uefi-serial.log
          grep -q "INPUT: USB HID boot mouse available" uefi-serial.log
          grep -q "NEXUS PCI DISCOVERY READY" uefi-serial.log
          grep -q "NEXUS STORAGE DISCOVERY READY" uefi-serial.log
          grep -q "NEXUS E1000 TX READY" uefi-serial.log
          grep -Eq "NEXUS VIRTIO-NET TX/RX READY|VIRTIO NET: RX/TX virtqueue setup failed" uefi-serial.log
          grep -Eq "VIRTIO GPU: 2D resource attached; CPU raster buffer now drives GPU scanout|DESKTOP: using firmware framebuffer backend" uefi-serial.log
          grep -q "NEXUS DHCP READY" uefi-serial.log
          grep -q "PCI: functions discovered:" uefi-serial.log
          grep -q "NEXUS IOAPIC PROBE READY" uefi-serial.log
          grep -q "NEXUS STORAGE DISCOVERY READY" uefi-serial.log
          grep -q "STORAGE: controller " uefi-serial.log
          grep -q "STORAGE: controller NVMe" uefi-serial.log
          grep -q "NEXUS NVME IDENTIFY READY" uefi-serial.log
          grep -q "NVMe: model:" uefi-serial.log
          grep -q "NEXUS NVME NAMESPACE READY" uefi-serial.log
          grep -q "NVMe: namespace count:" uefi-serial.log
          grep -q "NVMe: namespace logical block bytes:" uefi-serial.log
          grep -q "NEXUS NVME BLOCK DEVICE READY" uefi-serial.log
          grep -q "NEXUS NVME WRITE SELFTEST READY" uefi-serial.log
          grep -q "NEXUS NXFS JOURNAL READY" uefi-serial.log
          grep -q "NEXUS NXFS VFS READY" uefi-serial.log
          grep -q "NVMe: blockdev_read verified LBAs 0 and 1" uefi-serial.log
          grep -q "GPT: validated header and entry CRCs; discovered test partition" uefi-serial.log
