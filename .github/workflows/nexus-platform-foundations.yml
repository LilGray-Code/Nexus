name: Nexus Platform Foundation Tests

on:
  push:
    branches:
      - nexus-original-kernel-roadmap
    paths:
      - "kernel/src/driver_manager.*"
      - "kernel/src/storage.c"
      - "kernel/src/service_manager.*"
      - "docs/architecture/PLATFORM-SERVICES-AND-DRIVERS.md"
      - "docs/hardware/**"
      - "kernel/tests/driver_manager_test.c"
      - "kernel/tests/service_manager_test.c"
      - "kernel/src/boot_pack.*"
      - "kernel/src/vfs.*"
      - "kernel/tests/boot_pack_test.c"
      - "kernel/tests/vfs_directory_test.c"
      - "build/make-system-pack.py"
      - "build/test-system-pack.py"
      - ".github/workflows/nexus-platform-foundations.yml"
  pull_request:
    branches:
      - nexus-original-kernel-roadmap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Driver registry and service supervisor host tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Nexus
        uses: actions/checkout@v4
      - name: Test modular driver registry
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/driver_manager.c \
            kernel/tests/driver_manager_test.c \
            -o /tmp/nexus-driver-manager-test
          /tmp/nexus-driver-manager-test
      - name: Compile the production driver registry and storage integration
        run: |
          flags="-std=gnu11 -Os -Wall -Wextra -Werror -ffreestanding -fno-builtin -fno-stack-protector -fno-pic -fno-pie -fno-asynchronous-unwind-tables -fno-unwind-tables -fno-common -m64 -march=x86-64 -mno-red-zone -mno-mmx -mno-sse -mno-sse2 -mgeneral-regs-only -mcmodel=kernel -Ikernel/include -Ikernel/src -Iinstaller"
          cc $flags -c kernel/src/driver_manager.c -o /tmp/nexus-driver-manager.o
          cc $flags -c kernel/src/storage.c -o /tmp/nexus-storage-driver-dispatch.o
      - name: Test checksummed boot-time system pack
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/boot_pack.c kernel/tests/boot_pack_test.c \
            -o /tmp/nexus-boot-pack-test
          /tmp/nexus-boot-pack-test
          python3 build/test-system-pack.py
      - name: Test read-only system-pack VFS overlay
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/vfs.c kernel/src/nxfs.c \
            kernel/src/boot_pack.c kernel/tests/vfs_directory_test.c \
            -o /tmp/nexus-vfs-directory-test
          /tmp/nexus-vfs-directory-test
      - name: Test dependency-aware service supervisor
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/service_manager.c \
            kernel/tests/service_manager_test.c \
            -o /tmp/nexus-service-manager-test
          /tmp/nexus-service-manager-test
