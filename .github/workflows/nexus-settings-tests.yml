name: Nexus hardware, settings and kernel regression tests

on:
  push:
    branches:
      - nexus-original-kernel-roadmap
    paths:
      - "kernel/src/settings.c"
      - "kernel/src/settings.h"
      - "kernel/src/display.c"
      - "kernel/src/display.h"
      - "kernel/src/desktop.c"
      - "kernel/src/cpu.c"
      - "kernel/src/cpu.h"
      - "kernel/src/smp.c"
      - "kernel/src/smp.h"
      - "kernel/src/gpu.c"
      - "kernel/src/gpu.h"
      - "kernel/src/virtio_gpu.c"
      - "kernel/src/virtio_gpu.h"
      - "kernel/src/virtio_pci.c"
      - "kernel/src/virtio_pci.h"
      - "kernel/src/virgl_protocol.c"
      - "kernel/src/virgl_protocol.h"
      - "kernel/tests/virgl_protocol_test.c"
      - "kernel/tests/cpu_test.c"
      - "kernel/tests/gpu_test.c"
      - "kernel/src/memory.c"
      - "kernel/src/memory.h"
      - "kernel/tests/memory_smp_test.c"
      - "kernel/src/main.c"
      - "kernel/Makefile"
      - "kernel/tests/settings_test.c"
      - "kernel/tests/display_test.c"
      - ".github/workflows/nexus-settings-tests.yml"
  pull_request:
    branches:
      - nexus-original-kernel-roadmap

permissions:
  contents: read

jobs:
  settings-host-tests:
    name: Hardware inventory and system regression tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Nexus
        uses: actions/checkout@v4

      - name: Compile settings model with strict warnings
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/settings.c \
            kernel/tests/settings_test.c \
            -o /tmp/nexus-settings-test

      - name: Run settings persistence tests
        run: /tmp/nexus-settings-test

      - name: Compile and run EDID, mode-list and rollback tests
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/include -Ikernel/src kernel/src/display.c \
            kernel/tests/display_test.c -o /tmp/nexus-display-test
          /tmp/nexus-display-test

      - name: Test CPU vendor, hybrid-core and power capability discovery
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Ikernel/src kernel/src/cpu.c kernel/tests/cpu_test.c \
            -o /tmp/nexus-cpu-test
          /tmp/nexus-cpu-test

      - name: Test GPU family identification and PCI BAR inventory
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/gpu.c kernel/tests/gpu_test.c \
            -o /tmp/nexus-gpu-test
          /tmp/nexus-gpu-test

      - name: Test Virgl 3D command stream encoding
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/virgl_protocol.c \
            kernel/tests/virgl_protocol_test.c \
            -o /tmp/nexus-virgl-protocol-test
          /tmp/nexus-virgl-protocol-test

      - name: Stress the SMP-safe physical page allocator
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -DNEXUS_MEMORY_HOST_TEST -pthread \
            -Ikernel/include -Ikernel/src \
            kernel/src/memory.c kernel/tests/memory_smp_test.c \
            -o /tmp/nexus-memory-smp-test
          /tmp/nexus-memory-smp-test

      - name: Build the freestanding Nexus kernel
        run: make -C kernel
