name: Nexus Wi-Fi state and 802.11 parser tests

on:
  push:
    branches:
      - nexus-installed-desktop-separation
      - nexus-original-kernel-roadmap
    paths:
      - "kernel/src/wifi.c"
      - "kernel/src/wifi.h"
      - "kernel/src/wifi_80211.c"
      - "kernel/src/wifi_80211.h"
      - "kernel/src/wifi_pci.c"
      - "kernel/src/wifi_pci.h"
      - "kernel/src/win_driver_inf.c"
      - "kernel/src/win_driver_inf.h"
      - "kernel/src/win_driver_pe.c"
      - "kernel/src/win_driver_pe.h"
      - "kernel/src/win_driver_package.c"
      - "kernel/src/win_driver_package.h"
      - "kernel/src/win_driver_ndis.c"
      - "kernel/src/win_driver_ndis.h"
      - "kernel/tests/win_driver_ndis_test.c"
      - "kernel/tests/wifi_test.c"
      - "kernel/tests/wifi_80211_test.c"
      - "kernel/tests/wifi_pci_test.c"
      - "kernel/tests/win_driver_inf_test.c"
      - "kernel/tests/win_driver_pe_test.c"
      - "kernel/tests/win_driver_package_test.c"
      - ".github/workflows/nexus-wifi-tests.yml"
  pull_request:
    branches:
      - nexus-original-kernel-roadmap
    paths:
      - "kernel/src/wifi.c"
      - "kernel/src/wifi.h"
      - "kernel/src/wifi_80211.c"
      - "kernel/src/wifi_80211.h"
      - "kernel/src/wifi_pci.c"
      - "kernel/src/wifi_pci.h"
      - "kernel/src/win_driver_inf.c"
      - "kernel/src/win_driver_inf.h"
      - "kernel/src/win_driver_pe.c"
      - "kernel/src/win_driver_pe.h"
      - "kernel/src/win_driver_package.c"
      - "kernel/src/win_driver_package.h"
      - "kernel/src/win_driver_ndis.c"
      - "kernel/src/win_driver_ndis.h"
      - "kernel/tests/win_driver_ndis_test.c"
      - "kernel/tests/wifi_test.c"
      - "kernel/tests/wifi_80211_test.c"
      - "kernel/tests/wifi_pci_test.c"
      - "kernel/tests/win_driver_inf_test.c"
      - "kernel/tests/win_driver_pe_test.c"
      - ".github/workflows/nexus-wifi-tests.yml"

permissions:
  contents: read

jobs:
  wifi-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile Wi-Fi state tests with strict warnings
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/wifi.c kernel/tests/wifi_test.c \
            -o /tmp/nexus-wifi-test
      - name: Run Wi-Fi state tests
        run: /tmp/nexus-wifi-test
      - name: Compile 802.11 beacon parser tests with strict warnings
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/wifi_80211.c \
            kernel/tests/wifi_80211_test.c -o /tmp/nexus-wifi-80211-test
      - name: Run 802.11 beacon parser tests
        run: /tmp/nexus-wifi-80211-test
      - name: Compile Wi-Fi PCI and Windows INF integration tests
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/wifi_pci.c kernel/src/win_driver_inf.c \
            kernel/src/win_driver_pe.c kernel/src/win_driver_package.c \
            kernel/tests/wifi_pci_test.c -o /tmp/nexus-wifi-pci-test
      - name: Run Wi-Fi PCI and Windows INF integration tests
        run: /tmp/nexus-wifi-pci-test
      - name: Compile Windows PE driver inspection tests
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/win_driver_pe.c \
            kernel/tests/win_driver_pe_test.c -o /tmp/nexus-win-pe-test
      - name: Run Windows PE driver inspection tests
        run: /tmp/nexus-win-pe-test
      - name: Compile combined Windows driver package assessment tests
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/win_driver_inf.c \
            kernel/src/win_driver_pe.c kernel/src/win_driver_package.c \
            kernel/tests/win_driver_package_test.c \
            -o /tmp/nexus-win-package-test
      - name: Run combined Windows driver package assessment tests
        run: /tmp/nexus-win-package-test
      - name: Compile NDIS adapter lifecycle tests
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \\
            -Ikernel/src kernel/src/win_driver_ndis.c \\
            kernel/tests/win_driver_ndis_test.c -o /tmp/nexus-win-ndis-test
      - name: Run NDIS adapter lifecycle tests
        run: /tmp/nexus-win-ndis-test
      - name: Compile Windows INF hardware-ID matching tests
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ikernel/src kernel/src/win_driver_inf.c \
            kernel/tests/win_driver_inf_test.c -o /tmp/nexus-win-inf-test
      - name: Run Windows INF hardware-ID matching tests
        run: /tmp/nexus-win-inf-test
