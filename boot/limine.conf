timeout: 3
default_entry: 1
interface_branding: NEXUS OS - ORIGINAL KERNEL
interface_branding_colour: 18D2EB

/Nexus OS Installer - Live Environment
    protocol: limine
    path: boot():/boot/nexus-installer.elf
    module_path: boot():/boot/nexus-os.elf
    module_path: boot():/EFI/BOOT/BOOTX64.EFI
    module_path: boot():/boot/limine/limine-bios-hdd.bin
    module_path: boot():/boot/limine/limine-bios.sys
