# The ISO is a dedicated installer medium. The installed disk receives
# its own desktop-only configuration after a successful installation.
timeout: 5
default_entry: 1
remember_last_entry: no
interface_branding: NEXUS OS INSTALLER
interface_branding_colour: 18D2EB
interface_resolution: 1920x1080

/Install Nexus OS
    protocol: limine
    path: boot():/boot/nexus-kernel.elf
    cmdline: nexus.mode=installer
    resolution: 1920x1080x32
    module_path: boot():/EFI/BOOT/BOOTX64.EFI
    module_path: boot():/boot/limine/limine-bios-hdd.bin
    module_path: boot():/boot/limine/limine-bios.sys
